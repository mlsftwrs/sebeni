[metadata]
name = sebeni
version = 0.2.0
description = Self-aware morphotactic pattern generation toolkit for Low-Resource Languages
long_description = file: README.md
long_description_content_type = text/markdown
author = s7d11
license = MIT
url = https://seben.robotsmali.org
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
install_requires =
    typer>=0.9.0
    rich>=12.0.0
    pyyaml>=6.0
    jinja2>=3.1
    numpy>=1.23
    pydantic>=2.0
    setuptools>=65,<81
    funcparserlib
    intervaltree
    pytrie
    attrdict3
    regex
python_requires = >=3.10
include_package_data = True

[options.packages.find]
include = beni*
exclude = tests*

[options.package_data]
beni =
    utils/res/*.json
    utils/prompts/*
    data/samples/*
    data/baselines/*/*
    data/raw/*
    data/test.json
    data/exp.yaml
    core/hub/templates/*

[options.exclude_package_data]
beni =
    *.old
    *.backup
    *Zone.Identifier

[options.entry_points]
console_scripts =
    sebeni = beni.cli.main:app

[options.extras_require]
train =
    torch
    transformers
    trl>=0.14
    peft
    datasets
    accelerate
    trackio
wandb =
    wandb
distil =
    google-genai>=0.17.0
    openai
    groq
    together
docs =
    mkdocs-material>=9.5
    mkdocstrings[python]>=0.25
dev =
    pytest>=7.0
    pytest-mock>=3.10
    ruff>=0.6
    datasets
gui =
    wxPython
