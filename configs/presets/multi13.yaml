# MULTI13 preset. Override the arm with `sebeni exp --preset multi13 --algorithm sft`.
preset: multi13
project_name: sebeni-multi13
algorithm: grpo          # sft | grpo | dpo | apo

model:
  model_name: HuggingFaceTB/SmolLM2-135M
  load_in_4bit: true
  use_peft: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.1

data:
  default_lang: bam
  languages: [multi13]
  scheme: completion

trainer:
  framework: torch
  learning_rate: 5.0e-6
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  max_steps: 10
  num_train_epochs: 1.0
  beta: 0.1
  num_generations: 4
  temperature: 0.9
  warmup_ratio: 0.0
  weight_decay: 0.0
  lr_scheduler_type: cosine
  seed: 42
  bf16: false
  gradient_checkpointing: false
  use_cpu: false
  report_to: trackio

distillation:
  enabled: true
  backend: algorithmic
  model: gemini-2.5-flash
  tau: 0.5
  hitl: false

experiment:
  dataset: packaged
  freeze_resources: true
  scope: MULTI13
  max_eval_rows: 1
  kveritas: false
  kveritas_seal: false

reward:
  format_weight: 0.2
  morph_weight: 0.3
  rule_weight: 0.3
  lang_weight: 0.2

safety:
  enabled: true
